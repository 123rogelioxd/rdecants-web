[build]
  publish = "."

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ── HTML — never cache, always fresh (solves "old version on phone") ──────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma        = "no-cache"

# ── JS — ETag revalidation (no download if unchanged, solves stale cache) ─────
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "no-cache"

# ── Data — always fresh ───────────────────────────────────────────────────────
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── CSS — long cache; invalidated via ?v=VERSION query string in HTML ─────────
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Images — immutable (filenames include content hash or never change) ───────
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Clean URLs for the three top-level experiences ──────────────────────────
[[redirects]]
  from   = "/catalogo"
  to     = "/catalogo.html"
  status = 200

[[redirects]]
  from   = "/elegir"
  to     = "/elegir.html"
  status = 200

[[redirects]]
  from   = "/ayudame-a-elegir"
  to     = "/elegir.html"
  status = 200

[[redirects]]
  from   = "/ayuda"
  to     = "/ayuda.html"
  status = 200

# ── Slug routes for product detail pages ────────────────────────────────────
[[redirects]]
  from   = "/perfume/*"
  to     = "/product.html"
  status = 200

[[redirects]]
  from   = "/mood/*"
  to     = "/mood.html"
  status = 200

# ── Redirects — SPA-safe (not needed for MPA but future-proof) ───────────────
[[redirects]]
  from   = "/404"
  to     = "/index.html"
  status = 404
